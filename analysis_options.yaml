# Análisis estricto. Criterio de aceptación de cada fase: `flutter analyze` con cero issues.
include: package:flutter_lints/flutter.yaml

# riverpod_lint 3.x usa el sistema nuevo de plugins del analizador
# (analysis_server_plugin), no custom_lint: se declara aquí, no en pubspec.
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # freezed + json_serializable colocan anotaciones en targets que el
    # analizador marca; es ruido conocido del codegen, no un error nuestro.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - use_super_parameters
